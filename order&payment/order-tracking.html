<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Order Tracking - Exclusive Store</title>
    <link rel="stylesheet" href="/css/style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href='https://unpkg.com/boxicons@2.1.4/css/boxicons.min.css' rel='stylesheet'>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', sans-serif;
            background: #f5f5f5;
            min-height: 100vh;
        }

        .tracking-container {
            max-width: 900px;
            margin: 40px auto;
            padding: 0 20px;
        }

        /* Search Section */
        .search-section {
            background: white;
            border-radius: 16px;
            padding: 40px;
            text-align: center;
            box-shadow: 0 4px 20px rgba(0,0,0,0.08);
            margin-bottom: 30px;
        }

        .search-section h1 {
            font-size: 32px;
            margin-bottom: 10px;
            color: #333;
        }

        .search-section p {
            color: #666;
            margin-bottom: 30px;
        }

        .search-box {
            display: flex;
            gap: 15px;
            max-width: 500px;
            margin: 0 auto;
        }

        .search-box input {
            flex: 1;
            padding: 14px 20px;
            border: 2px solid #e0e0e0;
            border-radius: 12px;
            font-size: 16px;
            transition: all 0.3s;
        }

        .search-box input:focus {
            outline: none;
            border-color: #db4444;
        }

        .search-box button {
            padding: 14px 30px;
            background: #db4444;
            color: white;
            border: none;
            border-radius: 12px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
        }

        .search-box button:hover {
            background: #c03939;
            transform: translateY(-2px);
        }

        /* Order Details Section */
        .order-details {
            background: white;
            border-radius: 16px;
            overflow: hidden;
            box-shadow: 0 4px 20px rgba(0,0,0,0.08);
            display: none;
        }

        /* Order Header */
        .order-header {
            background: linear-gradient(135deg, #db4444, #c03939);
            color: white;
            padding: 25px 30px;
        }

        .order-header h2 {
            font-size: 24px;
            margin-bottom: 5px;
        }

        .order-header p {
            opacity: 0.9;
        }

        .order-id-badge {
            display: inline-block;
            background: rgba(255,255,255,0.2);
            padding: 5px 15px;
            border-radius: 20px;
            font-size: 14px;
            margin-top: 10px;
        }

        /* Status Timeline */
        .timeline-section {
            padding: 30px;
            border-bottom: 1px solid #f0f0f0;
        }

        .timeline {
            display: flex;
            justify-content: space-between;
            position: relative;
            margin: 30px 0;
        }

        .timeline::before {
            content: '';
            position: absolute;
            top: 30px;
            left: 0;
            right: 0;
            height: 3px;
            background: #e0e0e0;
            z-index: 0;
        }

        .timeline-step {
            text-align: center;
            flex: 1;
            position: relative;
            z-index: 1;
        }

        .step-icon {
            width: 60px;
            height: 60px;
            background: white;
            border: 3px solid #e0e0e0;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 12px;
            transition: all 0.3s;
            position: relative;
            background: white;
        }

        .step-icon i {
            font-size: 24px;
            color: #ccc;
        }

        .timeline-step.completed .step-icon {
            border-color: #28a745;
            background: #28a745;
        }

        .timeline-step.completed .step-icon i {
            color: white;
        }

        .timeline-step.active .step-icon {
            border-color: #db4444;
            animation: pulse 1.5s infinite;
        }

        .timeline-step.active .step-icon i {
            color: #db4444;
        }

        .step-label {
            font-weight: 600;
            margin-bottom: 5px;
        }

        .step-date {
            font-size: 12px;
            color: #999;
        }

        @keyframes pulse {
            0% { transform: scale(1); box-shadow: 0 0 0 0 rgba(219, 68, 68, 0.4); }
            70% { transform: scale(1.05); box-shadow: 0 0 0 10px rgba(219, 68, 68, 0); }
            100% { transform: scale(1); box-shadow: 0 0 0 0 rgba(219, 68, 68, 0); }
        }

        /* Info Grid */
        .info-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 20px;
            padding: 30px;
            border-bottom: 1px solid #f0f0f0;
        }

        .info-card {
            background: #f8f9fa;
            padding: 20px;
            border-radius: 12px;
        }

        .info-card h3 {
            font-size: 16px;
            color: #333;
            margin-bottom: 15px;
            padding-bottom: 10px;
            border-bottom: 2px solid #db4444;
            display: inline-block;
        }

        .info-row {
            margin-bottom: 10px;
            font-size: 14px;
        }

        .info-row strong {
            display: inline-block;
            width: 100px;
            color: #666;
        }

        /* Items Table */
        .items-section {
            padding: 30px;
        }

        .items-section h3 {
            margin-bottom: 20px;
            color: #333;
        }

        .items-table {
            width: 100%;
            border-collapse: collapse;
        }

        .items-table th,
        .items-table td {
            padding: 12px;
            text-align: left;
            border-bottom: 1px solid #f0f0f0;
        }

        .items-table th {
            background: #f8f9fa;
            font-weight: 600;
            color: #333;
        }

        .product-cell {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .product-img {
            width: 50px;
            height: 50px;
            object-fit: cover;
            border-radius: 8px;
        }

        .total-row {
            background: #f8f9fa;
            font-weight: bold;
        }

        /* Footer */
        .order-footer {
            padding: 20px 30px;
            background: #f8f9fa;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .print-btn, .back-btn {
            padding: 10px 20px;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-size: 14px;
            font-weight: 600;
            transition: all 0.3s;
        }

        .print-btn {
            background: #333;
            color: white;
        }

        .print-btn:hover {
            background: #555;
        }

        .back-btn {
            background: #db4444;
            color: white;
        }

        .back-btn:hover {
            background: #c03939;
        }

        /* Loading State */
        .loading {
            text-align: center;
            padding: 60px;
        }

        .spinner {
            width: 50px;
            height: 50px;
            border: 4px solid #f0f0f0;
            border-top-color: #db4444;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
            margin: 0 auto 20px;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        /* Error State */
        .error-message {
            text-align: center;
            padding: 60px;
            background: white;
            border-radius: 16px;
        }

        .error-message i {
            font-size: 60px;
            color: #dc3545;
            margin-bottom: 20px;
        }

        /* Responsive */
        @media (max-width: 768px) {
            .info-grid {
                grid-template-columns: 1fr;
            }
            
            .timeline {
                flex-direction: column;
                gap: 20px;
            }
            
            .timeline::before {
                display: none;
            }
            
            .timeline-step {
                display: flex;
                align-items: center;
                gap: 15px;
                text-align: left;
            }
            
            .step-icon {
                margin: 0;
            }
            
            .search-box {
                flex-direction: column;
            }
            
            .order-footer {
                flex-direction: column;
                gap: 10px;
            }
            
            .items-table {
                font-size: 12px;
            }
            
            .product-img {
                width: 40px;
                height: 40px;
            }
        }
    </style>
</head>
<body>
    

    <div class="tracking-container">
        <!-- Search Section -->
        <div class="search-section" id="search-section">
            <h1>Track Your Order</h1>
            <p>Enter your order ID to track your order status</p>
            <div class="search-box">
                <input type="text" id="order-id-input" placeholder="Enter Order ID" autocomplete="off">
                <button onclick="trackOrder()">
                    <i class="fas fa-search"></i> Track Order
                </button>
            </div>
        </div>

        <!-- Order Details Section -->
        <div id="order-details" class="order-details"></div>
    </div>

   

    <!-- Scripts - Order matters! -->
    <script src="/js/utils.js"></script>
    <script src="/js/cart.js"></script>
    <script src="https://unpkg.com/pocketbase/dist/pocketbase.umd.js"></script>
    <script src="/js/payment.js"></script>
    <script src="/js/checkout.js"></script>
    <script src="/js/user.js"></script> 
    <script src="../js/index.js"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    
    <script>
        // DO NOT declare pb here - it's already declared in index.js
        // Just wait for it to be available
        
        // Track order by ID
        async function trackOrder(orderId = null) {
            const orderIdInput = orderId || document.getElementById('order-id-input').value.trim();
            const orderDetailsDiv = document.getElementById('order-details');
            
            if (!orderIdInput) {
                alert('Please enter an order ID');
                return;
            }
            
            // Update input field
            document.getElementById('order-id-input').value = orderIdInput;
            
            // Show loading state
            orderDetailsDiv.innerHTML = `
                <div class="loading">
                    <div class="spinner"></div>
                    <p>Loading order details...</p>
                </div>
            `;
            orderDetailsDiv.style.display = 'block';
            
            // Wait for pb to be available
            let retries = 0;
            while (!window.pb && retries < 20) {
                await new Promise(r => setTimeout(r, 100));
                retries++;
            }
            
            if (!window.pb) {
                orderDetailsDiv.innerHTML = `
                    <div class="error-message">
                        <i class="fas fa-exclamation-triangle"></i>
                        <h3>System Error</h3>
                        <p>Unable to connect to the server. Please refresh the page.</p>
                    </div>
                `;
                return;
            }
            
            try {
                console.log('Tracking order:', orderIdInput);
                
                // Try to find order by ID
                let order = null;
                
                try {
                    order = await window.pb.collection('orders').getOne(orderIdInput, {
                        $autoCancel: false
                    });
                    console.log('Order found by direct ID');
                } catch (e) {
                    console.log('Direct lookup failed, trying search...');
                    const orders = await window.pb.collection('orders').getFullList({
                        filter: `id ~ "${orderIdInput}"`,
                        $autoCancel: false
                    });
                    
                    if (orders.length > 0) {
                        order = orders[0];
                        console.log('Order found by search');
                    }
                }
                
                if (order) {
                    displayOrderDetails(order);
                } else {
                    orderDetailsDiv.innerHTML = `
                        <div class="error-message">
                            <i class="fas fa-search"></i>
                            <h3>Order Not Found</h3>
                            <p>We couldn't find an order with ID: <strong>${escapeHtml(orderIdInput)}</strong></p>
                            <button onclick="resetSearch()" class="back-btn" style="margin-top: 20px;">Try Another ID</button>
                        </div>
                    `;
                }
                
            } catch (error) {
                console.error('Error tracking order:', error);
                orderDetailsDiv.innerHTML = `
                    <div class="error-message">
                        <i class="fas fa-exclamation-triangle"></i>
                        <h3>Error Loading Order</h3>
                        <p>${escapeHtml(error.message)}</p>
                        <button onclick="resetSearch()" class="back-btn" style="margin-top: 20px;">Try Again</button>
                    </div>
                `;
            }
        }
        
        // Display order details
        function displayOrderDetails(order) {
            const orderDetailsDiv = document.getElementById('order-details');
            
            // Parse items if string
            let items = order.items;
            if (typeof items === 'string') {
                try {
                    items = JSON.parse(items);
                } catch(e) {
                    items = [];
                }
            }
            
            // Get order ID for display
            const displayOrderId = order.orderId || order.id.slice(-8).toUpperCase();
            
            // Define status steps
            const statusSteps = ['pending', 'processing', 'shipped', 'delivered'];
            const currentStepIndex = statusSteps.indexOf(order.orderStatus);
            
            // Status messages
            const statusMessages = {
                'pending': 'Your order has been received and is pending confirmation.',
                'processing': 'Your order is being processed and prepared for shipping.',
                'shipped': 'Your order has been shipped and is on its way!',
                'delivered': 'Your order has been delivered. Thank you for shopping with us!',
                'cancelled': 'This order has been cancelled.'
            };
            
            const html = `
                <div class="order-header">
                    <h2>Order Details</h2>
                    <p>Here's the complete information about your order</p>
                    <div class="order-id-badge">
                        <i class="fas fa-receipt"></i> Order #${displayOrderId}
                    </div>
                </div>
                
                <!-- Status Timeline -->
                <div class="timeline-section">
                    <h3>Order Status</h3>
                    <div class="timeline">
                        ${statusSteps.map((step, index) => `
                            <div class="timeline-step ${index < currentStepIndex ? 'completed' : ''} ${index === currentStepIndex && order.orderStatus !== 'cancelled' ? 'active' : ''}">
                                <div class="step-icon">
                                    <i class="fas ${getStepIcon(step)}"></i>
                                </div>
                                <div class="step-label">${step.charAt(0).toUpperCase() + step.slice(1)}</div>
                                <div class="step-date">${index <= currentStepIndex ? 'Completed' : 'Pending'}</div>
                            </div>
                        `).join('')}
                    </div>
                    <div style="margin-top: 20px; padding: 15px; background: ${order.orderStatus === 'cancelled' ? '#f8d7da' : '#e7f3ff'}; border-radius: 8px;">
                        <p style="margin: 0; color: ${order.orderStatus === 'cancelled' ? '#721c24' : '#0066cc'};">
                            <i class="fas ${order.orderStatus === 'cancelled' ? 'fa-ban' : 'fa-info-circle'}"></i>
                            ${statusMessages[order.orderStatus] || 'Status update pending'}
                        </p>
                    </div>
                </div>
                
                <!-- Info Grid -->
                <div class="info-grid">
                    <div class="info-card">
                        <h3>Order Information</h3>
                        <div class="info-row"><strong>Order ID:</strong> ${displayOrderId}</div>
                        <div class="info-row"><strong>Date:</strong> ${new Date(order.created).toLocaleString()}</div>
                        <div class="info-row"><strong>Payment Method:</strong> ${(order.paymentMethod || 'N/A').replace('_', ' ').toUpperCase()}</div>
                        <div class="info-row"><strong>Payment Status:</strong> 
                            <span style="color: ${order.paymentStatus === 'paid' ? '#28a745' : '#ff9800'}; font-weight: 600;">
                                ${order.paymentStatus === 'paid' ? '✓ Paid' : '⏳ Pending'}
                            </span>
                        </div>
                    </div>
                    <div class="info-card">
                        <h3>Delivery Information</h3>
                        <div class="info-row"><strong>Name:</strong> ${escapeHtml(order.customerName || order.customer_name || 'Guest')}</div>
                        <div class="info-row"><strong>Email:</strong> ${order.email || 'N/A'}</div>
                        <div class="info-row"><strong>Phone:</strong> ${order.phone || 'N/A'}</div>
                        <div class="info-row"><strong>Address:</strong> ${order.address || 'N/A'}</div>
                    </div>
                </div>
                
                <!-- Items Table -->
                <div class="items-section">
                    <h3>Order Items</h3>
                    <table class="items-table">
                        <thead>
                            <tr>
                                <th>Product</th>
                                <th style="text-align: center;">Quantity</th>
                                <th style="text-align: right;">Unit Price</th>
                                <th style="text-align: right;">Subtotal</th>
                            </tr>
                        </thead>
                        <tbody>
                            ${items.map(item => `
                                <tr>
                                    <td>
                                        <div class="product-cell">
                                            <img src="${item.img || '/images/placeholder.jpg'}" class="product-img" onerror="this.src='/images/placeholder.jpg'">
                                            <div>
                                                <strong>${escapeHtml(item.name)}</strong>
                                                ${item.color ? `<br><small>Color: ${item.color}</small>` : ''}
                                                ${item.size ? `<br><small>Size: ${item.size}</small>` : ''}
                                            </div>
                                        </div>
                                     </div>
                                    <td style="text-align: center;">${item.quantity || item.qty}</td>
                                    <td style="text-align: right;">${window.formatPrice ? window.formatPrice(item.price) : '$' + parseFloat(item.price).toFixed(2)}</td>
                                    <td style="text-align: right;">${window.formatPrice ? window.formatPrice((item.quantity || item.qty) * item.price) : '$' + ((item.quantity || item.qty) * parseFloat(item.price)).toFixed(2)}</td>
                                </tr>
                            `).join('')}
                        </tbody>
                        <tfoot>
                            <tr class="total-row">
                                <td colspan="3" style="text-align: right;"><strong>Total:</strong></td>
                                <td style="text-align: right;"><strong>${window.formatPrice ? window.formatPrice(order.total) : '$' + parseFloat(order.total).toFixed(2)}</strong></td>
                            </tr>
                        </tfoot>
                    </table>
                </div>
                
                <!-- Footer Actions -->
                <div class="order-footer">
                    <button class="back-btn" onclick="resetSearch()">
                        <i class="fas fa-search"></i> Track Another Order
                    </button>
                    <button class="print-btn" onclick="window.print()">
                        <i class="fas fa-print"></i> Print Receipt
                    </button>
                </div>
            `;
            
            orderDetailsDiv.innerHTML = html;
            orderDetailsDiv.scrollIntoView({ behavior: 'smooth', block: 'start' });
        }
        
        // Get icon for each status step
        function getStepIcon(step) {
            const icons = {
                'pending': 'fa-clock',
                'processing': 'fa-cogs',
                'shipped': 'fa-truck',
                'delivered': 'fa-check-circle'
            };
            return icons[step] || 'fa-circle';
        }
        
        // Reset search
        function resetSearch() {
            document.getElementById('order-id-input').value = '';
            document.getElementById('order-details').style.display = 'none';
            document.getElementById('search-section').scrollIntoView({ behavior: 'smooth' });
        }
        
        // Escape HTML
        function escapeHtml(str) {
            if (!str) return '';
            return str.replace(/[&<>]/g, function(m) {
                if (m === '&') return '&amp;';
                if (m === '<') return '&lt;';
                if (m === '>') return '&gt;';
                return m;
            });
        }
        
        // Auto-track from URL parameter
        async function autoTrackFromUrl() {
            const urlParams = new URLSearchParams(window.location.search);
            const orderId = urlParams.get('orderId');
            
            if (orderId) {
                console.log('Auto-tracking order from URL:', orderId);
                document.getElementById('order-id-input').value = orderId;
                // Wait a bit for everything to load
                setTimeout(() => {
                    trackOrder(orderId);
                }, 1000);
            }
        }
        
        // Initialize when DOM is ready
        document.addEventListener('DOMContentLoaded', function() {
            console.log('DOM ready, setting up tracking');
            
            // Initialize Lucide
            if (typeof lucide !== 'undefined') {
                lucide.createIcons();
            }
            
            // Auto-track if orderId in URL
            autoTrackFromUrl();
        });
    </script>
</body>
</html>
