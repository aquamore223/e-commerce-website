<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>checkout-page</title>
    <link rel="stylesheet" href="/css/style.css">
     <link rel="icon" href="favicon.ico" type="image/x-icon">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css"  />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap">
    <link href='https://unpkg.com/boxicons@2.1.4/css/boxicons.min.css' rel='stylesheet'>
</head>
<body>
     <header id="header">
        loading....
    </header>
   <div class="chkout-main">
      <div id="disp-hd" ><a href="">Home </a>/<a href=""> checkout</a></div>
        <div class="pg-flex-sb-ai">
           <div class="str-flex">
                <h2>Billing Details</h2>

                <label>First Name*</label>
                <input type="text" id="billing-firstname" required>

                <label>Company Name</label>
                <input type="text" id="billing-company">

                <label>Street Address*</label>
                <input type="text" id="billing-street" required>

                <label>Apartment, floor, etc. (optional)</label>
                <input type="text" id="billing-apartment">

                <label>Town/City*</label>
                <input type="text" id="billing-city" required>

                <label>Phone Number*</label>
                <input type="text" id="billing-phone" required>

                <label>Email Address*</label>
                <input type="email" id="billing-email" required>

                <div class="session-save">

                    <input type="checkbox" id="save-billing-details">

                    <p>Save this information for faster check-out next time</p>

                </div>
            </div>
                    <div class="check-out-prev" id="checkout-preview">
                    </div>
                    
        </div>
    </div>

    <footer id="footer"></footer>
    <script src="/js/utils.js"></script>
   <script src="/js/cart.js"></script>
   <script src="https://unpkg.com/pocketbase/dist/pocketbase.umd.js"></script>
   <script src="https://js.stripe.com/v3/"></script>
    <script src="https://www.paypal.com/sdk/js?client-id=your_paypal_client_id&currency=USD"></script>
    <script src="https://pay.google.com/gpay/pay.js"></script>
   <script src="/js/payment.js"></script>
   <script src="/js/checkout.js"></script>
   <script src="/js/user.js"></script> 
  <script src="../js/index.js"></script>
  <script src="https://unpkg.com/lucide@latest"></script>
<script>
  lucide.createIcons();
</script>
</body>
</html>
