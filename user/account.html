<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Account Page</title>
  <link rel="stylesheet" href="/css/style.css">
  <link rel="icon" href="favicon.ico" type="image/x-icon">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap">
  <link href='https://unpkg.com/boxicons@2.1.4/css/boxicons.min.css' rel='stylesheet'>
</head>
<body>
  <header id="header">loading....</header>

  <main class="chkout-main">
    <div class="acct-hd">
      <div id="disp-hd"></div>
      <div>welcome <span id="acct-username"></span></div>
    </div>

    <div class="acct-hd">
      <!-- Dynamic sections container -->
      <div class="acct-fd"></div>

     <div class="edit-profile">
    <h3>Edit Your Profile</h3>
    <form id="profile-form" class="info-form">
        <div class="info-flex">
            <div class="str-flex" id="info-input">
                <label for="firstName">First Name</label>
                <input type="text" id="firstName" placeholder="Md" required>

                <label for="email">Email</label>
                <input type="email" id="email" placeholder="rimel1111@gmail.com" required>
            </div>
            <div class="str-flex" id="info-input">
                <label for="lastName">Last Name</label>
                <input type="text" id="lastName" placeholder="Rimel" required>

                <label for="address">Address</label>
                <input type="text" id="address" placeholder="Kingston, 5236, United States" required>
            </div>
        </div>

        <div class="str-flex">
            <label for="currentPassword">Current Password</label>
            <input type="password" id="currentPassword" placeholder="Current Password" required>

            <input type="password" id="newPassword" placeholder="New Password" required>
            <input type="password" id="confirmPassword" placeholder="Confirm New Password" required>
        </div>

        <div class="info-processing">
            <a href="#">cancel</a>
            <button type="submit" class="colored-btn">Save Changes</button>
        </div>
    </form>
</div>
    </div>
  </main>

  <footer id="footer"></footer>

  <script src="/js/utils.js"></script>
  <script src="/js/cart.js"></script>
  <script src="https://unpkg.com/pocketbase/dist/pocketbase.umd.js"></script>
  <script src="js/user.js"></script> 
  <script src="/js/index.js"></script>
  <script src="/js/account-page.js"></script>
  <script src="https://unpkg.com/lucide@latest"></script>
  <script>
    lucide.createIcons();
  </script>
</body>
</html>
