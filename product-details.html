<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>product-details</title>
    <link rel="stylesheet" href="/css/style.css">
     <link rel="icon" href="favicon.ico" type="image/x-icon">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css"  />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap">
    <link href='https://unpkg.com/boxicons@2.1.4/css/boxicons.min.css' rel='stylesheet'>
</head>
<body>
     <header id="header">
        loading....
    </header>

    <main class="product-details-main">

    <!-- Breadcrumb -->
    <div id="disp-hd"></div>

    <div class="product-details-display">

        <!-- Thumbnails -->
        <div class="product-img-wrapper-cont"></div>

        <!-- Main product image -->
        <div class="product-hero">
            <img src="" alt="">
        </div>

        <!-- Product info -->
        <div class="prod-det">
            <div class="prod-det-text">
                <h5></h5>          <!-- Name -->
                <p class="rating"></p>
                <p id="prod-price"></p>  <!-- Price -->
               <p class="product-description"></p>
            </div>

            <div class="prod-det-btns">
                <hr>
                <div class="product-colors"></div>
                <div class="sizes"></div>
                <div class="prod-det-no">
                    <span class="prod-no">
                        <button>-</button>
                        <input type="text" value="1">
                        <button>+</button>
                    </span>
                    <span class="prod-purchase-btn">
                        <button class="colored-btn add-to-cart-btn" data-id="">Add to Cart</button>
                    </span>
                    <span class="prod-like heart-icon " data-id="${product.id}"></span>
                </div>

                 <div class="delivery">
                             <div class="delivery-txt" id="delivery-txt1">
                                <i class="fa-solid fa-truck-fast"></i>
                                 <span><h4> free delivery</h4>
                                 <a href="">Enter your postal code for Delivery Availability</a>
                                 </span>
                             </div>
                              <div class="delivery-txt">
                                <i class="fa-solid fa-rotate"></i>
                                 <span><h4> Return Delivery</h4>
                                    <p>Free 30 Days Delivery Returns. <a href="">Details</a></p>
                                 
                                 </span>
                             </div>
                        </div>
            </div>
            
        </div>
    </div>

    <!-- Related Items -->
    <div class="related-grid"></div>

</main>
    

    <footer id="footer"></footer>
    <script src="/js/utils.js"></script>
    <script src="https://unpkg.com/pocketbase/dist/pocketbase.umd.js"></script>
  <script src="/js/index.js"></script>
 <script src="/js/cart.js"></script>
 <script src="/js/product-page.js"></script>
  <script src="https://unpkg.com/lucide@latest"></script>
<script>
  lucide.createIcons();
</script>
</body>
</html>
